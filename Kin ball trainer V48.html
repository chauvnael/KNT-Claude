  <!-- Thème appliqué avant le premier affichage (évite le flash clair/sombre) -->
  <script>
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('knt-theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
    })();

    /* ---------- COULEURS : MODE CLAIR ---------- */

      --border: #293750;

      --court-deep: #74c6f1;
      --night: #101929;
      --night-2: #1a2740;

      --warn-border: #6e2a30;
      --warn-text: #f5b5b5;
      --halo: rgba(245, 240, 229, .09);

    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;

    .card {

      border: 1px solid var(--border);
      border-radius: 22px;

    .card-link { transition: transform .2s ease, border-color .2s ease; text-align: left; }
    .card-link:hover { transform: translateY(-3px); border-color: var(--court); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;

      transition: transform .15s ease, background-color .15s ease, border-color .15s ease;

    .btn-primary { background: var(--court); color: var(--on-accent); box-shadow: 3px 3px 0 var(--sun); }

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // --- ICON WRAPPER ---
    const Icon = ({ name, size = 18, className = "", fill = "none", strokeWidth = 2 }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        const el = iconRef.current;
        if (!el || !window.lucide) return;
        const pascal = name.replace(/(^|-)([a-z0-9])/g, (m, sep, c) => c.toUpperCase());
        const node = (window.lucide.icons && window.lucide.icons[pascal]) || window.lucide[pascal];
        if (!node) return;
        const svg = window.lucide.createElement(node);
        svg.setAttribute('width', size);
        svg.setAttribute('height', size);
        svg.setAttribute('stroke-width', strokeWidth);
        svg.setAttribute('fill', fill);
        svg.setAttribute('aria-hidden', 'true');
        el.replaceChildren(svg);
      }, [name, size, fill, strokeWidth]);
      return <span ref={iconRef} className={`inline-flex shrink-0 items-center justify-center ${className}`} style={{ width: size, height: size }} />;
    };

    // --- THÈME CLAIR / SOMBRE ---
    function useTheme() {
      const [theme, setTheme] = useState(() => document.documentElement.dataset.theme || 'light');
      useEffect(() => {
        document.documentElement.dataset.theme = theme;
        try { localStorage.setItem('knt-theme', theme); } catch (e) {}
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0c1320' : '#fbf8f0');
      }, [theme]);
      const toggle = useCallback(() => setTheme((t) => (t === 'dark' ? 'light' : 'dark')), []);
      return [theme, toggle];
    }

    function ThemeToggle({ theme, onToggle, night = false }) {
      const isDark = theme === 'dark';
      return (
        <button
          type="button"
          onClick={onToggle}
          aria-label={isDark ? 'Passer en mode clair' : 'Passer en mode sombre'}
          title={isDark ? 'Mode clair' : 'Mode sombre'}
          className={`flex h-11 w-11 items-center justify-center rounded-full border transition-colors ${night ? 'border-white/20 bg-white/10 text-onnight hover:bg-white/20' : 'border-line bg-surface text-ink hover:border-court'}`}
        >
          <Icon name={isDark ? 'sun' : 'moon'} size={19} />
        </button>
      );
    }

    // --- LISTE DES LANGUES ---
    const LANGUAGES = [
      { code: 'fr', sigle: 'FR', label: 'Français', flag: '🇫🇷' },
      { code: 'es', sigle: 'ES', label: 'Español', flag: '🇪🇸' },
      { code: 'en-gb', sigle: 'GB', label: 'English (UK)', flag: '🇬🇧' },
      { code: 'en-us', sigle: 'US', label: 'English (US)', flag: '🇺🇸' },
      { code: 'zh', sigle: 'CN', label: '中文', flag: '🇨🇳' },
    ];

    // --- COMPOSANT SÉLECTEUR DE LANGUE ---
    function LanguageSelector() {
      const [isOpen, setIsOpen] = useState(false);
      const [selectedLang, setSelectedLang] = useState(LANGUAGES[0]);
      const dropdownRef = useRef(null);

      useEffect(() => {
        const handleClickOutside = (event) => {
          if (dropdownRef.current && !dropdownRef.current.contains(event.target)) {
            setIsOpen(false);
          }
        };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      return (
        <div className="relative" ref={dropdownRef}>
          <button
            type="button"
            onClick={() => setIsOpen(!isOpen)}
            className="flex h-11 items-center gap-1.5 rounded-full border border-line bg-surface px-3.5 transition-colors hover:border-court"
            aria-expanded={isOpen}
            aria-label={`Langue : ${selectedLang.label}`}
          >
            <span className="text-xl leading-none">{selectedLang.flag}</span>
            <Icon name="chevron-down" size={15} className={`text-soft transition-transform duration-200 ${isOpen ? 'rotate-180' : ''}`} />
          </button>

          {isOpen && (
            <div className="absolute right-0 z-50 mt-2 w-56 rounded-2xl border border-line bg-surface p-1.5 shadow-xl animate-fadeIn">
              {LANGUAGES.map((lang) => {
                const isSelected = lang.code === selectedLang.code;
                return (
                  <button
                    key={lang.code}
                    type="button"
                    onClick={() => { setSelectedLang(lang); setIsOpen(false); }}
                    className={`flex min-h-[44px] w-full items-center justify-between rounded-xl px-3 text-[15px] transition-colors ${isSelected ? 'bg-surface2 font-bold text-courtdeep' : 'font-medium text-ink hover:bg-surface2'}`}
                  >
                    <span className="flex items-center gap-3">
                      <span className="text-lg leading-none">{lang.flag}</span>
                      <span>{lang.label}</span>
                    </span>
                    {isSelected && <Icon name="check" size={16} className="text-court" />}
                  </button>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    // --- COMPOSANT MASCOTTE ---

            <Icon name="smile" size={32} />
          </div>
        );
      }

      return (
        <div className={`halo flex shrink-0 items-center justify-center rounded-full ${className}`}>
          <img
            src="images/20260815_152922_0000.png"
            alt="Mascotte Coati"
            onError={() => setImgError(true)}
            className={`${size} object-contain`}
          />

      );
    }

    function loadSettings() {

        Object.keys(DEFAULT_SETTINGS).forEach((id) => {

    // --- ÉCRAN INTERACTIF CHRONO 5 MIN ÉCHAUFFEMENT ---
    function WarmupTimerScreen({ onStop, speak, stopSpeech }) {
      const TOTAL_TIME = 300; // 5 min
      const INTERVAL_TIME = 30; // 30s
      const [timeLeft, setTimeLeft] = useState(TOTAL_TIME);
      const [isPaused, setIsPaused] = useState(false);

      const currentStepIndex = Math.min(
        Math.floor((TOTAL_TIME - timeLeft) / INTERVAL_TIME),
        WARMUP_ROUTINE_5MIN.length - 1
      );
      const currentStep = WARMUP_ROUTINE_5MIN[currentStepIndex];
      const nextStep = WARMUP_ROUTINE_5MIN[currentStepIndex + 1];
      const stepTimeLeft = (timeLeft % INTERVAL_TIME) === 0 && timeLeft < TOTAL_TIME ? INTERVAL_TIME : (timeLeft % INTERVAL_TIME);

      const prevStepRef = useRef(-1);

      useEffect(() => {
        if (isPaused || timeLeft <= 0) return;
        const timer = setInterval(() => {
          setTimeLeft((prev) => prev - 1);
        }, 1000);
        return () => clearInterval(timer);
      }, [isPaused, timeLeft]);

      useEffect(() => {
        if (currentStepIndex !== prevStepRef.current && !isPaused && timeLeft > 0) {
          prevStepRef.current = currentStepIndex;
          speak(`Exercice ${currentStepIndex + 1} sur 10. ${currentStep.title}`);
        }
      }, [currentStepIndex, isPaused, timeLeft, speak, currentStep]);

      if (timeLeft <= 0) {
        return (
          <main className="flex min-h-[100dvh] flex-col items-center justify-center bg-[#172235] px-6 text-center text-white">
            <CoatiVector size="w-32 h-32" className="mb-5" />
            <h1 className="display text-[48px] text-[#f4c52d]">Échauffement terminé !</h1>
            <p className="mt-3 max-w-md text-[17px] text-white/70">Tes articulations et ton cardio sont au top. Bon entraînement !</p>
            <button type="button" onClick={onStop} className="btn btn-primary mt-8">Retour au menu</button>
          </main>
        );
      }

      return (
        <main className="min-h-[100dvh] bg-[#172235] px-5 py-5 text-white sm:px-8">
          <div className="mx-auto max-w-[760px]">
            <div className="flex items-center justify-between">
              <button type="button" onClick={() => { stopSpeech(); onStop(); }} className="btn btn-night">
                <Icon name="x" size={17} /> Quitter
              </button>
              <div className="text-right">
                <span className="block text-[12px] font-bold uppercase tracking-[.14em] text-white/60">Temps restant</span>
                <span className="tnum display text-[30px] text-white">{formatDuration(timeLeft)}</span>
              </div>
            </div>

            <div className="mt-6 rounded-[28px] border border-white/15 bg-white/5 p-6 text-center sm:p-10">
              <p className="text-[13px] font-bold uppercase tracking-[.14em] text-[#f4c52d]">Exercice {currentStepIndex + 1} sur 10</p>
              <h1 className="display mt-3 text-[40px] text-white sm:text-[56px]">{currentStep.title}</h1>
              <p className="mx-auto mt-4 max-w-md text-[17px] text-white/80">{currentStep.desc}</p>

              <div className="tnum display mt-7 text-[88px] leading-none text-[#f4c52d]" aria-live="off">{stepTimeLeft}<span className="text-[36px]">s</span></div>

              <div className="mt-6 h-3 w-full overflow-hidden rounded-full bg-white/10">
                <div className="h-full rounded-full bg-[#f4c52d] transition-all duration-1000 ease-linear" style={{ width: `${((30 - stepTimeLeft) / 30) * 100}%` }} />
              </div>

              <button type="button" onClick={() => setIsPaused(!isPaused)} className="btn btn-night mt-7 min-w-[170px]">
                <Icon name={isPaused ? 'play' : 'pause'} size={17} fill="currentColor" /> {isPaused ? 'Reprendre' : 'Pause'}
              </button>
            </div>

            {nextStep && (
              <p className="mt-5 text-center text-[15px] text-white/60">
                Ensuite : <strong className="text-white/90">{nextStep.title}</strong>
              </p>
            )}

            <div className="mt-7">
              <p className="mb-3 text-[12px] font-bold uppercase tracking-[.14em] text-white/50">Programme complet · 30 s par exercice</p>
              <ol className="grid gap-2 sm:grid-cols-2">
                {WARMUP_ROUTINE_5MIN.map((step, idx) => {
                  const isActive = idx === currentStepIndex;
                  const isDone = idx < currentStepIndex;
                  return (
                    <li
                      key={step.id}
                      className={`flex items-center gap-3 rounded-xl border px-3.5 py-2.5 text-[15px] transition-colors ${
                        isActive
                          ? 'border-[#f4c52d] bg-[#118fca] font-bold text-[#0d1626]'
                          : isDone
                            ? 'border-white/5 bg-white/5 text-white/40'
                            : 'border-white/10 bg-white/5 text-white/80'
                      }`}
                    >
                      <span className="tnum w-6 shrink-0 text-[13px] opacity-70">{isDone ? '✓' : String(idx + 1).padStart(2, '0')}</span>
                      <span className="truncate">{step.title}</span>
                    </li>
                  );
                })}
              </ol>
            </div>
          </div>
        </main>
      );
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    }

    function makeQuestion(pool) {
      const answer = pool[Math.floor(Math.random() * pool.length)];
      const others = shuffle(pool.filter((g) => g.id !== answer.id)).slice(0, 3);
      return { answer, options: shuffle([answer, ...others]) };
    }

    function GestureQuiz() {
      const TOTAL = 10;
      const [round, setRound] = useState(0);
      const [score, setScore] = useState(0);
      const [question, setQuestion] = useState(() => makeQuestion(GESTURES));
      const [picked, setPicked] = useState(null);

      const next = () => { setPicked(null); setRound((r) => r + 1); setQuestion(makeQuestion(GESTURES)); };
      const restart = () => { setScore(0); setRound(0); setPicked(null); setQuestion(makeQuestion(GESTURES)); };

      if (round >= TOTAL) {
        return (
          <div className="card p-8 text-center">
            <p className="eyebrow">Résultat</p>
            <div className="tnum display mt-2 text-[64px] text-courtdeep">{score}/{TOTAL}</div>

    // Qui peut-on appeler ? (Règlement FIKB 2024, art. 6.1.6 à 6.1.8)
    function allowedCalls(attacker, scores) {
      const ids = ['BLEU', 'GRIS', 'NOIR'];
      const others = ids.filter((id) => id !== attacker);
      const max = Math.max(...ids.map((id) => scores[id]));
      if (max >= 8) return { allowed: others, reason: 'Une équipe a au moins 8 points : à partir de là, on appelle qui on veut jusqu’à la fin de la période.' };
      const a = scores[attacker];
      const [o1, o2] = others;
      if (a === max) {
        const tied = others.filter((id) => scores[id] === a);
        if (tied.length === 1) return { allowed: tied, reason: 'Deux équipes sont à égalité en tête : elles doivent s’appeler entre elles.' };
        if (tied.length === 2) return { allowed: others, reason: 'Les trois équipes sont à égalité : on peut appeler l’une ou l’autre.' };
        if (scores[o1] === scores[o2]) return { allowed: others, reason: 'Tu mènes et les deux autres sont à égalité : tu peux appeler l’une ou l’autre.' };
        return { allowed: [scores[o1] > scores[o2] ? o1 : o2], reason: 'Tu mènes seul : tu dois appeler l’équipe deuxième au score.' };
      }
      if (scores[o1] === scores[o2]) return { allowed: others, reason: 'Les deux autres équipes sont à égalité en tête : tu peux appeler l’une ou l’autre.' };
      return { allowed: [scores[o1] > scores[o2] ? o1 : o2], reason: 'Tu n’es pas en tête : tu dois appeler l’équipe qui a le plus de points.' };
    }

    // --- ÉCRAN D'ENTRAÎNEMENT ---
    function TrainingScreen({ exercise, work, phase, signals, direction, sessionLeft, restLeft, signalCount, countdownNum, onStop }) {
      const detail = EXERCISES[exercise];
      const progress = Math.max(0, Math.min(100, ((work - sessionLeft) / work) * 100));

      let bgStyle = { backgroundColor: '#172235' };
      let isMultiColor = false;

      if (phase === 'signal' && signals.length > 0) {
        if (signals.length === 1) {
          bgStyle = { backgroundColor: signals[0].hex };
        } else if (signals.length > 1) {
          isMultiColor = true;
        }
      }

      return (
        <main className="relative flex min-h-[100dvh] w-full select-none flex-col justify-between overflow-hidden transition-colors duration-300" style={!isMultiColor ? bgStyle : {}}>
          {isMultiColor && (
            <div className="absolute inset-0 z-0 flex flex-col sm:flex-row">
              <div className="flex-1" style={{ backgroundColor: signals[0].hex }} />
              <div className="flex-1 border-t-4 border-white/20 sm:border-l-4 sm:border-t-0" style={{ backgroundColor: signals[1].hex }} />
            </div>
          )}

          <div className="relative z-10 flex items-center justify-between gap-3 border-b border-white/10 bg-black/40 p-4 text-white backdrop-blur-md sm:px-6">
            <button type="button" onClick={onStop} className="btn btn-night">
              <Icon name="x" size={18} /> Quitter
            </button>

            <div className="min-w-0 text-center">
              <span className="block truncate text-[13px] font-semibold uppercase tracking-[.12em] text-white/70">{detail.name}</span>
              <span className="tnum text-[15px] font-bold text-[#f4c52d]">{signalCount > 0 ? `Séquence ${signalCount}` : 'Prêt ?'}</span>
            </div>

            <div className="tnum display rounded-xl border border-white/10 bg-black/30 px-3.5 py-1.5 text-[30px] text-white" aria-label="Temps restant">
              {formatDuration(sessionLeft)}
            </div>
          </div>

          <div className="relative z-10 flex flex-1 flex-col items-center justify-center px-4 text-center">
            {phase === 'ready' && (
              <div className="animate-fadeIn max-w-lg rounded-[28px] border border-white/10 bg-black/50 p-8 backdrop-blur-md sm:p-10">
                <span className="text-[13px] font-bold uppercase tracking-[.14em] text-[#f4c52d]">Mise en place</span>
                <h1 className="display mt-3 text-[40px] text-white sm:text-[56px]">Attention, en position</h1>
                {countdownNum !== null && (
                  <div className="tnum display mt-4 text-[120px] leading-none text-[#f4c52d]">{countdownNum}</div>
                )}
              </div>
            )}

            {phase === 'rest' && (
              <div className="rounded-[28px] border border-white/10 bg-black/50 p-8 backdrop-blur-md sm:p-10">
                <span className="text-[13px] font-bold uppercase tracking-[.14em] text-[#f4c52d]">Replace-toi au centre</span>
                <h2 className="display mt-3 text-[40px] text-white sm:text-[56px]">Prochain appel</h2>
                <div className="tnum display mt-3 text-[80px] leading-none text-white/90">{restLeft}<span className="text-[36px]">s</span></div>
              </div>
            )}

            {phase === 'signal' && (
              <div className="pointer-events-none w-full max-w-4xl px-4">
                {exercise === 'reactivity-selective' ? (
                  <div className="animate-scaleIn space-y-3">
                    <span className="display block text-[48px] text-[#f4c52d] drop-shadow-md sm:text-[72px]">{direction}</span>
                    <h1 className="display text-[80px] tracking-wide text-white drop-shadow-2xl sm:text-[130px]">{signals[0].name}</h1>
                  </div>
                ) : signals.length === 1 ? (
                  <h1 className="animate-scaleIn display text-[100px] tracking-wide text-white drop-shadow-2xl sm:text-[170px]">{signals[0].name}</h1>
                ) : (
                  <div className="animate-scaleIn flex flex-col items-center justify-center gap-4 sm:flex-row sm:gap-10">
                    <div className="rounded-[28px] border border-white/20 bg-black/40 px-8 py-5 shadow-2xl backdrop-blur-md">
                      <span className="block text-[13px] font-bold uppercase tracking-wider text-white/70">1re couleur</span>
                      <span className="display text-[64px] text-white sm:text-[88px]">{signals[0].name}</span>
                    </div>
                    <span className="display rounded-2xl border border-white/20 bg-black/60 px-4 py-2 text-[32px] text-[#f4c52d]">Omnikin</span>
                    <div className="rounded-[28px] border border-white/20 bg-black/40 px-8 py-5 shadow-2xl backdrop-blur-md">
                      <span className="block text-[13px] font-bold uppercase tracking-wider text-white/70">2e couleur</span>
                      <span className="display text-[64px] text-white sm:text-[88px]">{signals[1].name}</span>
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>

          <div className="relative z-10 border-t border-white/10 bg-black/40 p-4 backdrop-blur-md sm:px-6" style={{ paddingBottom: 'calc(16px + env(safe-area-inset-bottom))' }}>
            <div className="mx-auto max-w-xl">
              <div className="tnum mb-2 flex justify-between text-[14px] font-bold text-white/80">
                <span>Progression</span>
                <span>{Math.round(progress)} %</span>
              </div>
              <div className="h-3 w-full overflow-hidden rounded-full bg-white/20" role="progressbar" aria-valuenow={Math.round(progress)} aria-valuemin={0} aria-valuemax={100}>
                <div className="h-full rounded-full bg-[#f4c52d] transition-all duration-300" style={{ width: `${progress}%` }} />
              </div>
            </div>
          </div>
        </main>
      );
    }

    // --- FIN DE SÉANCE ---
    function TrainingDoneScreen({ result, onRestart, onBack }) {
      const detail = EXERCISES[result.exercise];
      return (
        <main className="flex min-h-[100dvh] flex-col items-center justify-center bg-[#172235] px-6 py-10 text-center text-white">
          <CoatiVector size="w-32 h-32" className="mb-5" />
          <p className="text-[13px] font-bold uppercase tracking-[.14em] text-white/60">{detail.name}</p>
          <h1 className="display mt-2 text-[52px] text-[#f4c52d]">Séance terminée !</h1>

          <div className="mt-7 grid w-full max-w-sm grid-cols-2 gap-3">
            <div className="rounded-2xl border border-white/10 bg-white/5 p-4">
              <div className="tnum display text-[40px] text-white">{formatDuration(result.work)}</div>
              <div className="text-[14px] text-white/60">d'effort</div>
            </div>
            <div className="rounded-2xl border border-white/10 bg-white/5 p-4">
              <div className="tnum display text-[40px] text-white">{result.sequences}</div>
              <div className="text-[14px] text-white/60">séquence{result.sequences > 1 ? 's' : ''}</div>
            </div>
          </div>

          <div className="mt-8 flex w-full max-w-sm flex-col gap-3">
            <button type="button" onClick={onRestart} className="btn btn-primary !min-h-[54px] !text-[17px]">
              <Icon name="rotate-ccw" size={18} /> Recommencer
            </button>
            <button type="button" onClick={onBack} className="btn btn-night">Retour aux exercices</button>
          </div>
        </main>
      );
    }

    // --- APPLICATION PRINCIPALE ---
    function App() {
      const [theme, toggleTheme] = useTheme();
      const [screen, setScreen] = useState('home');
      const [selectedExercise, setSelectedExercise] = useState('appel');
      const [settings, setSettings] = useState(loadSettings);
      const [activeSession, setActiveSession] = useState(null);
      const [lastResult, setLastResult] = useState(null);
      const [phase, setPhase] = useState('ready');
      const [signals, setSignals] = useState([]);
      const [direction, setDirection] = useState('');
      const [sequenceCount, setSequenceCount] = useState(0);
      const [sessionLeft, setSessionLeft] = useState(60);
      const [restLeft, setRestLeft] = useState(0);
      const [countdownNum, setCountdownNum] = useState(null);
      const [sessionEndAt, setSessionEndAt] = useState(null);
      const [nextSignalAt, setNextSignalAt] = useState(null);
      const [restDeadline, setRestDeadline] = useState(null);
      const [now, setNow] = useState(Date.now());
      const lastSignalRef = useRef(null);
      const audioCtxRef = useRef(null);
      const signalTimeoutRef = useRef(null);

      const handleNavigate = (targetScreen) => {
        setScreen(targetScreen);
        window.scrollTo(0, 0);
      };

      // Réglages mémorisés sur l'appareil
      useEffect(() => {
        try { localStorage.setItem('knt-settings', JSON.stringify(settings)); } catch (e) {}
      }, [settings]);

      // Garde l'écran allumé pendant une séance (si le navigateur le permet)
      useEffect(() => {
        if (screen !== 'training' && screen !== 'warmup-timer') return;
        let lock = null;
        let cancelled = false;
        if ('wakeLock' in navigator) {
          navigator.wakeLock.request('screen').then((l) => {
            if (cancelled) l.release().catch(() => {}); else lock = l;
          }).catch(() => {});
        }
        return () => {
          cancelled = true;
          if (lock) lock.release().catch(() => {});
        };
      }, [screen]);

      const speak = useCallback((text) => {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'fr-FR';
        utterance.rate = 1.3;
        window.speechSynthesis.speak(utterance);
      }, []);

      const playBeep = useCallback((freq = 440, duration = 0.15) => {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          if (!audioCtxRef.current) audioCtxRef.current = new AudioContext();
          const ctx = audioCtxRef.current;
          if (ctx.state === 'suspended') ctx.resume();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + duration);
        } catch (e) {
          console.log('Audio Context Error:', e);
        }
      }, []);

      const stopSpeech = useCallback(() => {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      }, []);

      const getActiveSignalsList = useCallback((config) => {
        const allowedIds = config.colors || ['BLEU', 'GRIS', 'NOIR'];
        return ALL_SIGNALS.filter(s => allowedIds.includes(s.id));
      }, []);

      const triggerSequence = useCallback((timestamp, config) => {
        const availableSignals = getActiveSignalsList(config);
        if (availableSignals.length === 0) return;

        let nextSignals;
        let chosenDirection = '';

        if (config.exercise === 'double' && availableSignals.length > 1) {
          const first = Math.floor(Math.random() * availableSignals.length);
          let second = Math.floor(Math.random() * availableSignals.length);
          while (second === first) second = Math.floor(Math.random() * availableSignals.length);
          nextSignals = [availableSignals[first], availableSignals[second]];
        } else {
          let chosen;
          const preventConsecutive = config.preventConsecutiveColors ?? true;
          if (preventConsecutive && lastSignalRef.current && availableSignals.length > 1) {
            const filtered = availableSignals.filter(s => s.id !== lastSignalRef.current.id);
            chosen = filtered[Math.floor(Math.random() * filtered.length)];
          } else {
            chosen = availableSignals[Math.floor(Math.random() * availableSignals.length)];
          }
          lastSignalRef.current = chosen;
          nextSignals = [chosen];
        }

        let calculatedRest = config.restFixed || 4;

        if (config.exercise === 'reactivity-selective') {
          chosenDirection = DIRECTIONS[Math.floor(Math.random() * DIRECTIONS.length)];
          setDirection(chosenDirection);

          const isPlayerColor = nextSignals[0].id === (config.playerColor || 'BLEU');

          if (isPlayerColor) {
            calculatedRest = config.restMax || 6;
          } else {
            calculatedRest = config.shortRest || 1.5;
          }
        } else if (config.isRandomRest && config.restMin && config.restMax) {
          const lo = Math.min(config.restMin, config.restMax);
          const hi = Math.max(config.restMin, config.restMax);
          calculatedRest = Math.floor(Math.random() * (hi - lo + 1)) + lo;
        }

        setSignals(nextSignals);
        setSequenceCount((v) => v + 1);
        setPhase('signal');
        setRestLeft(calculatedRest);
        setRestDeadline(timestamp + calculatedRest * 1000);

        if (config.exercise === 'reactivity-selective') {
          speak(`${chosenDirection}, Omnikin ${nextSignals[0].name}`);
        } else if (config.exercise === 'double' && nextSignals[1]) {
          speak(`${nextSignals[0].name}, Omnikin ${nextSignals[1].name}`);
        } else if (config.exercise === 'plot-sprint') {
          speak(`Touche le plot, Omnikin ${nextSignals[0].name}`);
        } else {
          speak(`Omnikin ${nextSignals[0].name}`);
        }

        const displayTime = config.exercise === 'reactivity-selective' ? 1200 : 2500;
        clearTimeout(signalTimeoutRef.current);
        signalTimeoutRef.current = setTimeout(() => {
          setPhase('rest');
        }, Math.min(displayTime, calculatedRest * 1000));

      }, [speak, getActiveSignalsList]);

      useEffect(() => {
        if (screen !== 'training' || !sessionEndAt) return;
        const interval = setInterval(() => setNow(Date.now()), 200);
        return () => clearInterval(interval);
      }, [screen, sessionEndAt]);

      useEffect(() => {
        if (screen !== 'training' || !sessionEndAt || !activeSession) return;
        const remaining = Math.max(0, Math.ceil((sessionEndAt - now) / 1000));
        setSessionLeft(remaining);

        if (remaining <= 0) {
          clearTimeout(signalTimeoutRef.current);
          stopSpeech();
          playBeep(660, 0.5);
          setLastResult({ exercise: activeSession.exercise, work: activeSession.work, sequences: sequenceCount });
          setSessionEndAt(null);
          setActiveSession(null);
          handleNavigate('training-done');
          return;
        }

        if (phase === 'ready' && nextSignalAt) {
          const diffSec = Math.ceil((nextSignalAt - now) / 1000);
          if (diffSec > 0 && diffSec <= 3 && diffSec !== countdownNum) {
            setCountdownNum(diffSec);
            playBeep(520, 0.12);
          } else if (diffSec > 3 && diffSec !== countdownNum) {
            setCountdownNum(diffSec);
          }

          if (now >= nextSignalAt) {
            playBeep(880, 0.3);
            triggerSequence(now, activeSession);
            setNextSignalAt(null);
            setCountdownNum(null);
          }
        } else if (phase === 'rest' && restDeadline) {
          const restRem = Math.max(0, Math.ceil((restDeadline - now) / 1000));
          setRestLeft(restRem);
          if (now >= restDeadline) {
            triggerSequence(now, activeSession);
          }
        }
      }, [now, screen, sessionEndAt, activeSession, phase, nextSignalAt, restDeadline, countdownNum, sequenceCount, triggerSequence, playBeep, stopSpeech]);

      const startTraining = () => {
        stopSpeech();
        clearTimeout(signalTimeoutRef.current);
        const config = { exercise: selectedExercise, ...settings[selectedExercise] };
        const startedAt = Date.now();
        const cd = (config.countdown || 3) * 1000;

        lastSignalRef.current = null;
        setActiveSession(config);
        setSignals([]);
        setDirection('');
        setSequenceCount(0);
        setPhase('ready');
        setSessionLeft(config.work);
        setRestLeft(0);
        setCountdownNum(config.countdown || 3);
        setSessionEndAt(startedAt + cd + config.work * 1000);
        setNextSignalAt(startedAt + cd);
        setRestDeadline(null);
        setNow(startedAt);

        speak("Attention, en position");

        handleNavigate('training');
      };

      const stopTraining = () => {
        stopSpeech();
        clearTimeout(signalTimeoutRef.current);
        setSessionEndAt(null);
        setActiveSession(null);
        handleNavigate('exercise-detail');
      };

      const goToHome = () => {
        stopSpeech();
        clearTimeout(signalTimeoutRef.current);
        setSessionEndAt(null);
        setActiveSession(null);
        handleNavigate('home');
      };

      const updateConfigForExercise = (exId, newFields) => {
        setSettings(prev => ({
          ...prev,
          [exId]: { ...prev[exId], ...newFields }
        }));
      };

      return (
        <Shell screen={screen} onNavigate={handleNavigate} onGoHome={goToHome} theme={theme} onToggleTheme={toggleTheme}>
          {screen === 'home' && (
            <HomeScreen onNavigate={handleNavigate} />
          )}

          {screen === 'home-exercises' && (
            <HomeExercisesListScreen
              onSelectExercise={(exId) => {
                setSelectedExercise(exId);
                handleNavigate('exercise-detail');
              }}
              onBackHome={goToHome}
              onNavigate={handleNavigate}
            />
          )}

          {screen === 'exercise-detail' && (
            <ExerciseDetailConfigScreen
              exerciseId={selectedExercise}
              config={settings[selectedExercise]}
              onUpdateConfig={(fields) => updateConfigForExercise(selectedExercise, fields)}
              onStart={startTraining}
              onBack={() => handleNavigate('home-exercises')}
            />
          )}

          {screen === 'warmup' && (
            <WarmupPage
              onBack={goToHome}
              onStart5MinWarmup={() => handleNavigate('warmup-timer')}
              onNavigate={handleNavigate}
            />
          )}

          {screen === 'warmup-timer' && (
            <WarmupTimerScreen
              onStop={() => handleNavigate('warmup')}
              speak={speak}
              stopSpeech={stopSpeech}
            />
          )}

          {screen === 'gym-exercises' && (
            <GymExercisesPage onBack={goToHome} onNavigate={handleNavigate} />
          )}

          {screen === 'about' && (
            <AboutPage
              onBack={goToHome}
              onNavigateLegal={() => handleNavigate('legal')}
            />
          )}

          {screen === 'legal' && (
            <LegalPage onBack={() => handleNavigate('about')} />
          )}

          {screen === 'learn' && <LearnHubPage onNavigate={handleNavigate} onBack={goToHome} />}
          {screen === 'discover' && <DiscoverPage onBack={() => handleNavigate('learn')} onNavigate={handleNavigate} />}
          {screen === 'rules' && <RulesPage onBack={() => handleNavigate('learn')} onNavigate={handleNavigate} />}
          {screen === 'referee' && <RefereePage onBack={() => handleNavigate('learn')} />}
          {screen === 'techniques' && <TechniquesPage onBack={() => handleNavigate('learn')} />}
          {screen === 'strategy' && <StrategyPage onBack={() => handleNavigate('learn')} />}
          {screen === 'club' && <ClubPage onBack={goToHome} onNavigate={handleNavigate} />}

          {screen === 'demo' && (
            <DemoScreen
              exercise={selectedExercise}
              onSelectExercise={(ex) => setSelectedExercise(ex)}
              onBack={goToHome}
              onNavigate={handleNavigate}
            />
          )}

          {screen === 'training' && activeSession && (
            <TrainingScreen
              exercise={activeSession.exercise}
              work={activeSession.work}
              phase={phase}
              signals={signals}
              direction={direction}
              sessionLeft={sessionLeft}
              restLeft={restLeft}
              signalCount={sequenceCount}
              countdownNum={countdownNum}
              onStop={stopTraining}
            />
          )}

          {screen === 'training-done' && lastResult && (
            <TrainingDoneScreen
              result={lastResult}
              onRestart={startTraining}
              onBack={() => handleNavigate('home-exercises')}
            />
          )}
        </Shell>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
